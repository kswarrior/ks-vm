<div id="users" class="view">
    <div class="page-header">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h1 style="font-size: 1.75rem; font-weight: 800;">Users</h1>
            <button class="btn btn-primary" onclick="showAddUserForm()">+ Add User</button>
        </div>
    </div>
    <div id="add-user-form" class="card" style="display:none; max-width: 500px;">
        <div class="form-group"><label>Username</label><input type="text" id="user-name"></div>
        <div class="form-group"><label>Email Address</label><input type="email" id="user-email"></div>
        <div class="form-group"><label>Password</label><input type="password" id="user-pass"></div>
        <div style="display:flex; gap:12px;">
            <button class="btn btn-primary" onclick="addUser()">Create User</button>
            <button class="btn btn-outline" onclick="showAddUserForm(false)">Cancel</button>
        </div>
    </div>
    <div class="grid-classic" id="user-list"></div>
</div>
