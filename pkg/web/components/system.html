<div id="system" class="view">
    <div class="page-header">
        <h1 style="font-size: 1.75rem; font-weight: 800;">System Dashboard</h1>
    </div>
    <div class="grid-classic">
        <div class="card">
            <h3 style="margin-bottom:15px;">CPU Usage (%)</h3>
            <div style="height: 200px;"><canvas id="cpuChart"></canvas></div>
        </div>
        <div class="card">
            <h3 style="margin-bottom:15px;">RAM Usage</h3>
            <div style="height: 200px;"><canvas id="ramChart"></canvas></div>
        </div>
        <div class="card">
            <h3 style="margin-bottom:15px;">Disk Usage</h3>
            <div style="height: 200px;"><canvas id="diskChart"></canvas></div>
        </div>
        <div class="card">
            <h3 style="margin-bottom:15px;">Network (KB/s)</h3>
            <div style="height: 200px;"><canvas id="netChart"></canvas></div>
        </div>
    </div>
</div>
