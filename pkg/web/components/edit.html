<div id="edit" class="view">
    <div class="page-header">
        <h1 id="edit-title" style="font-size: 1.75rem; font-weight: 800;">Settings</h1>
    </div>
    <div class="card" style="max-width: 600px;">
        <div class="form-group"><label>Display Name</label><input type="text" id="edit-name"></div>
        <div class="form-row">
            <div class="form-group"><label>vCPU Cores</label><input type="number" id="edit-cpu"></div>
            <div class="form-group"><label>Memory (MiB)</label><input type="number" id="edit-ram"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Username</label><input type="text" id="edit-user"></div>
            <div class="form-group"><label>New Password</label><input type="password" id="edit-pass" placeholder="Keep empty to skip"></div>
        </div>
        <div style="display:flex; gap:12px;">
            <button class="btn btn-primary" onclick="updateInstance()">Save Settings</button>
            <button class="btn btn-outline" onclick="showTab('instances')">Cancel</button>
        </div>
    </div>
</div>
