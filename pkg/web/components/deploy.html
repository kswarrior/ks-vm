<div id="deploy" class="view">
    <div class="page-header">
        <h1 style="font-size: 1.75rem; font-weight: 800;">Deploy New VPS</h1>
    </div>
    <div class="card" style="max-width: 800px;">
        <div class="form-row">
            <div class="form-group"><label>Instance Name</label><input type="text" id="deploy-name" placeholder="e.g. web-server-01"></div>
            <div class="form-group">
                <label>Instance Type</label>
                <select id="deploy-type" onchange="toggleDeployFields()">
                    <option value="vm">Virtual Machine (KVM)</option>
                    <option value="container">LXD Container</option>
                    <option value="docker">Docker Container</option>
                </select>
            </div>
        </div>
        <div id="deploy-image-section" class="form-group" style="position:relative;">
            <label>Select Operating System</label>
            <input type="text" id="image-search" placeholder="Search OS images..." onkeyup="filterImages()">
            <div id="image-dropdown" class="dropdown" style="width:100%; top:100%; left:0;"></div>
            <input type="hidden" id="deploy-image">
        </div>
        <div id="lxd-deploy-note" class="form-group" style="display:none; color:var(--text-muted); font-size:0.8rem; margin-top:-10px; margin-bottom:15px;">
            Note: For LXD, you can also type an alias like <b>ubuntu:24.04</b> in the search box if not in pool.
        </div>
        <div class="form-row">
            <div class="form-group"><label>vCPU Cores</label><input type="number" id="deploy-cpu" value="1"></div>
            <div class="form-group"><label>Memory (MiB)</label><input type="number" id="deploy-ram" value="1024"></div>
        </div>
        <div class="form-group"><label>Disk Size (GB)</label><input type="number" id="deploy-disk" value="20"></div>
        <div class="form-row">
            <div class="form-group"><label>Admin Username</label><input type="text" id="deploy-user" value="root"></div>
            <div class="form-group"><label>Admin Password</label><input type="password" id="deploy-pass"></div>
        </div>
        <div style="display:flex; gap:12px; margin-top:12px;">
            <button class="btn btn-primary" onclick="deployInstance()">Deploy Now</button>
            <button class="btn btn-outline" onclick="showTab('instances')">Cancel</button>
        </div>
    </div>
</div>
