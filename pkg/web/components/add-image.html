<div id="add-image" class="view">
    <div class="page-header">
        <h1 style="font-size: 1.75rem; font-weight: 800;">Add OS Image</h1>
    </div>
    <div class="card" style="max-width: 600px;">
        <div class="form-group">
            <label>Architecture / Type</label>
            <select id="img-type" onchange="toggleAddImgFields()">
                <option value="vm">Virtual Machine (KVM)</option>
                <option value="container">LXD Container</option>
                <option value="docker">Docker Container</option>
            </select>
        </div>
        <div class="form-group">
            <label id="img-name-label">Image Label</label>
            <input type="text" id="img-name" placeholder="e.g. Ubuntu 24.04 LTS">
        </div>
        <div class="form-group">
            <label id="img-url-label">Source URL (QCOW2)</label>
            <input type="text" id="img-url" placeholder="https://cloud-images.ubuntu.com/...">
            <small id="img-help" style="display:block; margin-top:5px; color:var(--text-muted);"></small>
        </div>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn btn-primary" onclick="addImage()">Add Image Now</button>
            <button class="btn btn-outline" onclick="showTab('images')">Cancel</button>
        </div>
    </div>
</div>
