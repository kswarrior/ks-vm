<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ksvm | Management Console</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="sticky-header">
        <div class="logo">KSVM PANEL</div>
        <div id="status-bar" style="font-size: 0.8em; color: var(--secondary-color);">Connected to hypervisor</div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li class="active" data-tab="instances">Instances</li>
                    <li data-tab="deploy">Deploy New</li>
                    <li data-tab="images">Images</li>
                    <li data-tab="monitor">Monitor</li>
                    <li data-tab="users">Users</li>
                    <li data-tab="log">Audit Log</li>
                </ul>
            </nav>
        </aside>

        <main id="content">
            <div id="instances" class="tab-content active">
                <h2>Active Instances</h2>
                <div class="grid" id="instance-grid"></div>
            </div>

            <div id="deploy" class="tab-content">
                <h2>Deploy New Instance</h2>
                <div class="card" style="max-width: 600px;">
                    <input type="text" id="deploy-name" placeholder="Instance Name (e.g. web-prod)">
                    <input type="text" id="deploy-image" placeholder="Image (e.g. focal or docker://nginx)">

                    <div class="form-row">
                        <div>
                            <label>CPUs</label>
                            <input type="number" id="deploy-cpu" value="1">
                        </div>
                        <div>
                            <label>RAM (MiB)</label>
                            <input type="number" id="deploy-ram" value="1024">
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label>Disk (GB)</label>
                            <input type="number" id="deploy-disk" value="0">
                        </div>
                        <div>
                            <label>Guest User</label>
                            <input type="text" id="deploy-user" placeholder="ubuntu">
                        </div>
                    </div>

                    <label>Guest Password</label>
                    <input type="password" id="deploy-pass">

                    <button onclick="deployInstance()" style="width: 100%; margin-top: 10px;">PROVISION INSTANCE</button>
                </div>
            </div>

            <div id="edit" class="tab-content">
                <h2>Edit Instance: <span id="edit-target-name">--</span></h2>
                <div class="card" style="max-width: 600px;">
                    <div class="form-row">
                        <div>
                            <label>CPUs</label>
                            <input type="number" id="edit-cpu">
                        </div>
                        <div>
                            <label>RAM (MiB)</label>
                            <input type="number" id="edit-ram">
                        </div>
                    </div>
                    <button onclick="updateInstance()" style="width: 100%;">SAVE CHANGES</button>
                    <button onclick="showTab('instances')" style="width: 100%; margin-top: 10px; border-color: var(--secondary-color); color: var(--secondary-color);">CANCEL</button>
                </div>
            </div>

            <div id="monitor" class="tab-content">
                <h2>System Monitor</h2>
                <div class="grid">
                    <div class="card">
                        <h3>CPU Usage</h3>
                        <p id="cpu-usage">-- %</p>
                    </div>
                    <div class="card">
                        <h3>Memory Usage</h3>
                        <p id="ram-usage">-- MiB</p>
                    </div>
                </div>
            </div>

            <div id="images" class="tab-content">
                <h2>Base Images</h2>
                <div id="image-list" class="grid"></div>
            </div>

            <div id="users" class="tab-content">
                <h2>User Management</h2>
                <div id="user-list" class="grid"></div>
            </div>

            <div id="log" class="tab-content">
                <h2>Audit Log</h2>
                <div id="audit-log" class="card"></div>
            </div>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
