<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ksvm | Management Console</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.8l8 4v8.4l-8 4-8-4V8.8l8-4z"/></svg>
            KSVM PANEL
        </div>
        <button id="menu-toggle" style="background:none; border:none; display:none;">
            <svg style="width:24px;height:24px;" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
    </header>

    <div class="app-container">
        <aside id="sidebar" class="sidebar">
            <nav>
                <div class="nav-item active" data-tab="instances">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
                    Instances
                </div>
                <div class="nav-item" data-tab="images">
                    <svg viewBox="0 0 24 24"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z"/></svg>
                    Images
                </div>
                <div class="nav-item" data-tab="users">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    Users
                </div>
                <div class="nav-item" data-tab="log">
                    <svg viewBox="0 0 24 24"><path d="M13 3H6c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9l-7-6zm0 1.5L18.5 9H13V4.5zM6 20V5h6v5h5.5v10H6z"/></svg>
                    Audit Log
                </div>
            </nav>
        </aside>

        <main class="main-view">
            <div id="instances" class="view">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                    <h1 style="font-size: 1.5rem; font-weight: 800;">Instances</h1>
                    <button class="btn btn-primary" onclick="showTab('deploy')">+ Deploy Instance</button>
                </div>
                <div class="grid" id="instance-grid"></div>
            </div>

            <div id="deploy" class="view" style="display:none;">
                <h1 style="margin-bottom:24px;">Deploy New Instance</h1>
                <div class="card" style="max-width: 800px;">
                    <label style="display:block; margin-bottom:8px; font-weight:600;">Instance Name</label>
                    <input type="text" id="deploy-name" placeholder="e.g. web-server-01">

                    <label style="display:block; margin-bottom:8px; font-weight:600;">Select Base Image</label>
                    <div style="position:relative; margin-bottom:16px;">
                        <input type="text" id="image-search" placeholder="Search images..." onkeyup="filterImages()" style="margin-bottom:0;">
                        <div id="image-dropdown" style="display:none; position:absolute; left:0; right:0; background:#fff; border:1px solid var(--border); border-radius:8px; z-index:100; max-height:200px; overflow-y:auto; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);"></div>
                    </div>
                    <input type="hidden" id="deploy-image">

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
                        <div><label>vCPUs</label><input type="number" id="deploy-cpu" value="1"></div>
                        <div><label>RAM (MiB)</label><input type="number" id="deploy-ram" value="1024"></div>
                        <div><label>Disk (GB)</label><input type="number" id="deploy-disk" value="0"></div>
                        <div><label>User</label><input type="text" id="deploy-user" placeholder="ubuntu"></div>
                    </div>
                    <label>Password</label><input type="password" id="deploy-pass">

                    <div style="display:flex; gap:12px; margin-top:24px;">
                        <button class="btn btn-primary" onclick="deployInstance()" style="flex:1;">Provision Now</button>
                        <button class="btn" onclick="showTab('instances')" style="border-color:#ccc; color:#666;">Cancel</button>
                    </div>
                </div>
            </div>

            <div id="edit" class="view" style="display:none;">
                <h1 id="edit-title" style="margin-bottom:24px;">Edit Instance</h1>
                <div class="card" style="max-width: 600px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                        <div><label>CPUs</label><input type="number" id="edit-cpu"></div>
                        <div><label>RAM (MB)</label><input type="number" id="edit-ram"></div>
                    </div>
                    <button class="btn btn-primary" onclick="updateInstance()" style="width:100%; margin-top:16px;">Save Changes</button>
                    <button class="btn" onclick="showTab('instances')" style="width:100%; margin-top:8px; border-color:#ccc; color:#666;">Cancel</button>
                </div>
            </div>

            <div id="images" class="view" style="display:none;">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                    <h1 style="font-size: 1.5rem; font-weight: 800;">Base Images</h1>
                    <button class="btn btn-primary" onclick="showAddImageForm()">+ Add Image</button>
                </div>
                <div id="add-image-form" class="card" style="display:none; max-width: 600px; margin-bottom:32px;">
                    <label>Name</label><input type="text" id="img-name">
                    <label>URL/Path</label><input type="text" id="img-url">
                    <label>Type</label>
                    <select id="img-type" style="width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; margin-bottom:16px;">
                        <option value="vm">Virtual Machine</option>
                        <option value="container">Container</option>
                    </select>
                    <button class="btn btn-primary" onclick="addImage()">Register</button>
                    <button class="btn" onclick="showAddImageForm(false)">Cancel</button>
                </div>
                <div class="grid" id="image-list"></div>
            </div>

            <div id="users" class="view" style="display:none;">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                    <h1 style="font-size: 1.5rem; font-weight: 800;">Users</h1>
                    <button class="btn btn-primary" onclick="showAddUserForm()">+ Add User</button>
                </div>
                <div id="add-user-form" class="card" style="display:none; max-width: 600px; margin-bottom:32px;">
                    <label>Username</label><input type="text" id="user-name">
                    <label>Email</label><input type="email" id="user-email">
                    <label>Password</label><input type="password" id="user-pass">
                    <button class="btn btn-primary" onclick="addUser()">Create</button>
                    <button class="btn" onclick="showAddUserForm(false)">Cancel</button>
                </div>
                <div class="grid" id="user-list"></div>
            </div>

            <div id="log" class="view" style="display:none;">
                <h1 style="margin-bottom:32px;">Audit Log</h1>
                <div id="log-list" style="display:flex; flex-direction:column; gap:16px;"></div>
            </div>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
