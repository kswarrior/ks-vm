<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS VM | Cloud Panel</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="splash">
        <div class="splash-content">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.8l8 4v8.4l-8 4-8-4V8.8l8-4z"/></svg>
            <h2 style="font-weight:800; color:#111; letter-spacing: -0.02em;">KS VM</h2>
            <div class="loader-line"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal card">
            <h2 id="modal-title" style="margin-bottom:20px; font-weight:800;">Configuration</h2>
            <div id="modal-body"></div>
            <div class="modal-actions" style="margin-top:24px; display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button id="modal-confirm" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="brand">
            <svg viewBox="0 0 24 24"><path d="M21,16.5C21,16.88 20.79,17.21 20.47,17.38L12.57,21.82C12.41,21.94 12.21,22 12,22C11.79,22 11.59,21.94 11.43,21.82L3.53,17.38C3.21,17.21 3,16.88 3,16.5V7.5C3,7.12 3.21,6.79 3.53,6.62L11.43,2.18C11.59,2.06 11.79,2 12,2C12.21,2 12.41,2.06 12.57,2.18L20.47,6.62C20.79,6.79 21,7.12 21,7.5V16.5Z" fill="currentColor"/></svg>
            KS VM
        </div>
        <div class="top-nav">
            <div class="search-bar">
                <svg style="width:18px;height:18px;" viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,18.8L19,20.2L14.2,15.5V14.7L13.93,14.43C12.79,15.41 11.3,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C5.91,5 3,7.91 3,9.5C3,13.09 5.91,16 9.5,16C13.09,16 16,13.09 16,9.5C16,7.91 13.09,5 9.5,5Z"/></svg>
                Search for VPS, images...
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:16px;">
            <button id="menu-toggle" style="background:none; border:none; display:none; cursor:pointer; color:var(--text-main); padding:8px;">
                <svg style="width:24px;height:24px;" viewBox="0 0 24 24"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/></svg>
            </button>
            <div class="hide-mobile" style="width:36px;height:36px;background:var(--primary-light);border-radius:18px; display:flex; align-items:center; justify-content:center;">
                <svg style="width:20px;height:20px;color:var(--primary);" viewBox="0 0 24 24"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" fill="currentColor"/></svg>
            </div>
        </div>
    </header>

    <div class="app-container">
        <aside class="sidebar-icons">
            <div class="icon-nav-item active" data-tab="instances">
                <svg viewBox="0 0 24 24"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
            </div>
            <div class="icon-nav-item" data-tab="images">
                <svg viewBox="0 0 24 24"><path d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2M11,15V12H9V15H6V17H9V20H11V17H14V15H11Z"/></svg>
            </div>
            <div class="icon-nav-item" data-tab="users">
                <svg viewBox="0 0 24 24"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg>
            </div>
            <div class="icon-nav-item" data-tab="system">
                <svg viewBox="0 0 24 24"><path d="M11,2V22C5.9,21.5 2,17.2 2,12C2,6.8 5.9,2.5 11,2M13,2C18.1,2.5 22,6.8 22,12C22,17.2 18.1,21.5 13,22V2M15,12H18C18,10.3 17.3,8.8 16.2,7.8L15,9V12M15,15V12H12V15H15Z"/></svg>
            </div>
        </aside>
        <aside id="sidebar" class="sidebar">
            <div style="padding:0 24px; margin-bottom:24px; font-weight:800; color:#000; font-size:0.75rem; letter-spacing:0.08em; opacity:0.5;">MANAGEMENT</div>
            <nav>
                <div class="nav-item active" data-tab="instances">
                    <svg viewBox="0 0 24 24"><path d="M13,3H6C4.89,3 4,3.89 4,5V21C4,22.11 4.89,23 6,23H18C19.11,23 20,22.11 20,21V9L14,3M13,4.5L18.5,10H13V4.5M6,21V5H12V11H18V21H6Z"/></svg>
                    Instances
                </div>
                <div class="nav-item" data-tab="system">
                    <svg viewBox="0 0 24 24"><path d="M21,16.5C21,16.88 20.79,17.21 20.47,17.38L12.57,21.82C12.41,21.94 12.21,22 12,22C11.79,22 11.59,21.94 11.43,21.82L3.53,17.38C3.21,17.21 3,16.88 3,16.5V7.5C3,7.12 3.21,6.79 3.53,6.62L11.43,2.18C11.59,2.06 11.79,2 12,2C12.21,2 12.41,2.06 12.57,2.18L20.47,6.62C20.79,6.79 21,7.12 21,7.5V16.5Z"/></svg>
                    System Status
                </div>
                <div class="nav-item" data-tab="images">
                    <svg viewBox="0 0 24 24"><path d="M19,5V19H5V5H19M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M14,17V15H10V17H14M12,9L10,13H14L12,9Z"/></svg>
                    OS Images
                </div>
                <div class="nav-item" data-tab="users">
                    <svg viewBox="0 0 24 24"><path d="M12,12C14.21,12 16,10.21 16,8C16,5.79 14.21,4 12,4C9.79,4 8,5.79 8,8C8,10.21 9.79,12 12,12M12,14C9.33,14 4,15.34 4,18V20H20V18C20,15.34 14.67,14 12,14Z"/></svg>
                    Users
                </div>
                <div class="nav-item" data-tab="log">
                    <svg viewBox="0 0 24 24"><path d="M13,3H6C4.89,3 4,3.89 4,5V21C4,22.11 4.89,23 6,23H18C19.11,23 20,22.11 20,21V9L14,3M13,4.5L18.5,10H13V4.5M6,21V5H12V11H18V21H6Z"/></svg>
                    Logs
                </div>
            </nav>
        </aside>
        <main class="main-view" id="main-content"></main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
