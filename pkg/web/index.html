<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, dvh=100">
    <title>ksvm | Cyber Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="cyber-bg">
    <header class="sticky-header glassmorphic">
        <div class="logo">KSVM_SYS</div>
        <button id="menu-toggle" class="hamburger">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <aside id="sidebar" class="collapsing-sidebar glassmorphic">
            <nav>
                <ul>
                    <li class="active" data-tab="instances">INSTANCES</li>
                    <li data-tab="monitor">MONITOR</li>
                    <li data-tab="images">IMAGES</li>
                    <li data-tab="users">USERS</li>
                    <li data-tab="log">LOG</li>
                </ul>
            </nav>
        </aside>

        <main id="content">
            <div id="instances" class="tab-content active">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px;">
                    <h2>Active Instances</h2>
                    <button class="glassmorphic" onclick="showDeployForm()" style="padding: 10px 20px; color: var(--accent-color); cursor: pointer;">+ DEPLOY NEW</button>
                </div>

                <div id="deploy-form" class="card glassmorphic" style="display: none; margin: 20px;">
                    <h3>Deploy Instance</h3>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="text" id="deploy-name" placeholder="Instance Name">
                        <input type="text" id="deploy-image" placeholder="Image (e.g. docker://nginx)">
                        <button onclick="deployInstance()">DEPLOY</button>
                        <button onclick="showDeployForm(false)">CANCEL</button>
                    </div>
                </div>

                <div class="grid" id="instance-grid">
                    <!-- Dynamic Cards -->
                </div>
            </div>

            <div id="monitor" class="tab-content">
                <h2>System Monitor</h2>
                <div class="grid">
                    <div class="card glassmorphic">
                        <h3>Host Resource Usage</h3>
                        <p>CPU: <span id="cpu-usage">--</span>%</p>
                        <p>RAM: <span id="ram-usage">--</span> MiB</p>
                    </div>
                </div>
            </div>

            <div id="images" class="tab-content">
                <h2>Base Images</h2>
                <div id="image-list" class="grid"></div>
            </div>

            <div id="users" class="tab-content">
                <h2>User Management</h2>
                <div class="grid">
                    <div class="card glassmorphic">
                        <h3>Create User</h3>
                        <input type="text" placeholder="Username">
                        <input type="email" placeholder="Email">
                        <input type="password" placeholder="Password">
                        <button onclick="alert('User API stubbed')">CREATE</button>
                    </div>
                </div>
            </div>

            <div id="log" class="tab-content">
                <h2>Audit Log</h2>
                <div id="audit-log" class="glassmorphic" style="padding: 20px; min-height: 300px; font-family: monospace; white-space: pre-wrap;">
                    <!-- Logs injected here -->
                </div>
            </div>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
